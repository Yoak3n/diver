name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  rust-test:
    name: cargo test
    runs-on: windows-latest
    steps:
      # harness 是 git 子模块，必须递归检出，否则 crates/src-tauri 的路径引用与
      # TS 检查都缺源码。
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # tauri.conf.json 的 resources/sidecar、resources/pet/models 是 bundle-release
      # 的组装产物，干净 checkout 里不存在会让 tauri 构建脚本报错；单测只需路径存在。
      - name: prepare generated paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/sidecar, src-tauri/resources/pet/models, dist | Out-Null

      - name: cargo test --workspace
        run: cargo test --workspace

  ts-check:
    name: typecheck + 插件闭包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # 根 pnpm-workspace 覆盖 harness + cos-plugins，一次安装全量到位。
      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck（harness + cos-plugins）
        run: pnpm typecheck

      # 闭包检查是打包后自检：先按 harness 自身 lockfile 暖 store（组装内部的
      # pnpm install --offline 依赖它），再 --assemble-only 组装 sidecar 产物。
      - name: warm harness dependency store
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: assemble sidecar
        run: node scripts/bundle-release.mjs --assemble-only --skip-frontend

      # 插件解析闭包检查：锚定组装产物的真实运行布局，防 node_modules 泄漏假绿。
      - name: plugin closure check
        run: node scripts/check-plugin-closure.mjs
