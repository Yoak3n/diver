name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 安装包名取自 tauri.conf.json 的 version；先 bump 版本再打 v* 标签。
      - name: check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") {
            Write-Error "标签 ${{ github.ref_name }} 与 tauri.conf.json 版本 v$ver 不一致"
            exit 1
          }

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # bundle-release 会在随包 harness/ 里跑 pnpm install --offline；
      # 先按 harness 自己的 lockfile 装一遍暖 store，离线安装才不缺包。
      - name: warm harness dependency store
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: build NSIS installer
        shell: pwsh
        run: |
          $env:DIVER_NODE_BIN = (Get-Command node).Source
          # 裸 node 直调（与 ci.yml 装配一致）：经 `pnpm run` 包装会把 npm_config_*/NODE_ENV
          # 注入子进程，嵌套 pnpm install 曾据此静默丢 devDeps/optional 依赖（缺 @esbuild 二进制）。
          node scripts/bundle-release.mjs

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: diver-windows-nsis
          # Cargo workspace 在仓库根 → 产物在根 target/，不是 src-tauri/target/
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri v2 (wry/tao) Linux 系统依赖 + AppImage 运行时 FUSE + 模型解压的
      # bsdtar（GNU tar 不认 zip；24.04 的 fuse2 包名是 libfuse2t9，22.04 是 libfuse2）
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libarchive-tools file
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t9

      - name: check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$ver" != "${{ github.ref_name }}" ]; then
            echo "标签 ${{ github.ref_name }} 与 tauri.conf.json 版本 v$ver 不一致" >&2
            exit 1
          fi

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: warm harness dependency store
        working-directory: harness
        run: pnpm install --frozen-lockfile

      # bundle-release 在 Linux 上走 `tauri build --bundles appimage deb`，
      # 并在本平台装配 sidecar（vendor 闭包含 @esbuild 平台二进制，必须与目标平台一致）。
      - name: build AppImage & deb
        run: node scripts/bundle-release.mjs

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: diver-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # linux artifact 内部保留 appimage/ 与 deb/ 子目录（upload-artifact 按公共
      # 祖先裁剪路径），必须 ** 递归才能全部匹配。
      - name: create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
