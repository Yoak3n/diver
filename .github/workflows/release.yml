name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 安装包名取自 tauri.conf.json 的 version；先 bump 版本再打 v* 标签。
      - name: check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") {
            Write-Error "标签 ${{ github.ref_name }} 与 tauri.conf.json 版本 v$ver 不一致"
            exit 1
          }

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # bundle-release 会在随包 harness/ 里跑 pnpm install --offline；
      # 先按 harness 自己的 lockfile 装一遍暖 store，离线安装才不缺包。
      - name: warm harness dependency store
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: build NSIS installer
        shell: pwsh
        run: |
          $env:DIVER_NODE_BIN = (Get-Command node).Source
          # 裸 node 直调（与 ci.yml 装配一致）：经 `pnpm run` 包装会把 npm_config_*/NODE_ENV
          # 注入子进程，嵌套 pnpm install 曾据此静默丢 devDeps/optional 依赖（缺 @esbuild 二进制）。
          node scripts/bundle-release.mjs

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: diver-nsis
          # Cargo workspace 在仓库根 → 产物在根 target/，不是 src-tauri/target/
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
