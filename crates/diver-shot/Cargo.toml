[package]
name = "diver-shot"
version = "0.1.0"
edition = "2021"
description = "Diver 屏幕捕获引擎（显示器枚举 / 矩形截取 / JPEG 小体积编码）"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.6"
log = "0.4"

# Wayland：portal PNG 解码 + ashpd（纯 Rust，不链 libwayland / 不 spawn）
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
png = "0.17"
ashpd = "0.9"
futures-lite = "2"
url = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
