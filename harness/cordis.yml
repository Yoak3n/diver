- id: llm
  name: '@cos/llm'
- id: credentials
  name: '@cos/credentials'
  config:
    file: ./secrets.yml
- id: session
  name: '@cos/session'
- id: persistence
  name: '@cos/persistence'
  config:
    # 数据家园：root 相对 COS_HOME（sidecar 注入 harness/.cos-home）解析，
    # 会话日志与 diver-settings.json / workspace / memory 同目录统一管理。
    # 落盘格式与体积控制（见 @cos/persistence）：
    # - format 默认 standard：通用 agent 会话事件流（.pi/agent v3，id/parentId 链；
    #   assistant/chunk、turn/step 等内部记账事件不落盘）；internal = 原始事件行
    # - segmentBytes 默认 8MB：超过即轮转 <id>.N.jsonl，避免单文件膨胀
    # - maxSegments 默认 0（不限）；>0 时只保留最近 N 段，超出丢弃最旧段（限制 resume IO）
    root: sessions
- id: system-prompt
  name: '@cos/system-prompt'
- id: persona
  name: '@cos/persona'
- id: tools
  name: '@cos/tools'
- id: llm-deepseek
  name: '@cos/llm-deepseek'
  config:
    baseUrl: https://api.deepseek.com
    defaultModel: deepseek-v4-flash
- id: agents
  name: '@cos/agents'
- id: agent-loop
  name: '@cos/agent-loop'
  config:
    debugSystemPrompt: false
- id: subagents
  name: '@cos/subagents'
  config:
    # worker 单次运行的默认墙钟上限（超时则 cancel 该 worker agent）
    defaultTimeoutMs: 120000
