packages:
  - harness
  - harness/packages/*
  - harness/packages/dsh/*
  - examples/dsh-compat-example
  - cos-plugins/backend
  - cos-plugins/basic-tools
  - cos-plugins/companion
  - cos-plugins/memory
  - cos-plugins/self-prompt
  - cos-plugins/mcp
  - cos-plugins/llm-commandcode
  - cos-plugins/llm-volcark
  - cos-plugins/llm-custom
  - cos-plugins/native-bridge
  - cos-plugins/bundle-companion

nodeLinker: hoisted

# 非 TTY（cargo tauri dev 的 beforeDevCommand / CI）清理 node_modules 时不询问
confirmModulesPurge: false

allowBuilds:
  esbuild: true
  node-addon-require-builtin: true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
