[package]
name = "diver"
version = "0.1.0"
description = "Diver 桌面陪伴 Agent"
authors = ["Diver"]
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diver-geom = { path = "../crates/diver-geom" }
diver-memory = { path = "../crates/diver-memory" }
diver-presence = { path = "../crates/diver-presence" }
diver-search = { path = "../crates/diver-search" }
diver-shot = { path = "../crates/diver-shot" }
axum = "0.8"
tokio = { version = "^1.44", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
] }
chrono = { version = "^0.4", features = ["serde"] }

once_cell = "1.21.4"
anyhow = "^1.0.102"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
# 首启解压 node_modules.tar.zst（进程内解压，无黑窗；进度经 setup://progress 推给 UI）
tar = "0.4"
zstd = "0.13"

mouse_position = "0.1.4"
delay_timer = "0.11.6"
dirs = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# Windows: Job Object（KILL_ON_JOB_CLOSE）兜底清理 sidecar 进程树
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
